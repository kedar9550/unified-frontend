<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="180x180" href="/Circle_logo_White.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AUS | Digital Services - Aditya University</title>
  <meta name="description"
    content="Sign in to access your portal. Welcome to Digital Services Access all your academic resources in one place." />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add("dark-mode");
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <script>
    if (document.documentElement.classList.contains("dark-mode")) {
      document.body.classList.add("dark-mode");
    }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
